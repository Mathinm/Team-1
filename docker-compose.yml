services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-pms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Built from the POSTGRES_* values above, so the password is written in one place only (#31).
      DATABASE_URL: postgresql://${POSTGRES_USER:-pms}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-pms}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
      IDLE_TIMEOUT_MINUTES: ${IDLE_TIMEOUT_MINUTES:-30}
      REQUIRE_2FA: ${REQUIRE_2FA:-true}
      OTP_EXPIRE_MINUTES: ${OTP_EXPIRE_MINUTES:-10}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-PMS <no-reply@example.com>}
      STORE_TIMEZONE: ${STORE_TIMEZONE:-Asia/Kolkata}
      LOW_STOCK_CHECK_TIME: ${LOW_STOCK_CHECK_TIME:-06:00}
      DOOR_OPEN_LIMIT_MINUTES: ${DOOR_OPEN_LIMIT_MINUTES:-5}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # NFR-4a: python:3.12-slim has no curl, so Python itself calls /api/health.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    # NFR-4a: nginx:alpine has busybox wget. 127.0.0.1, not localhost (that can mean IPv6 ::1).
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # NFR-13 (TC-REL-03): daily pg_dump of the database into ./backups on your computer.
  # Script and restore steps: ops/pms-backup.sh and docs/S2-10-nfr.md.
  backup:
    image: postgres:16-alpine   # same image as db, so pg_dump matches the server version
    restart: unless-stopped
    command: ["sh", "/scripts/pms-backup.sh", "loop"]
    environment:
      # Standard PostgreSQL variables, read by pg_dump/pg_restore/psql. Same values as db.
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-pms}
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
      PGDATABASE: ${POSTGRES_DB:-pms}
      TZ: ${STORE_TIMEZONE:-Asia/Kolkata}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./ops:/scripts:ro     # the script, read-only
      - ./backups:/backups    # a folder on your computer, so "down -v" can't delete backups
    depends_on:
      db:
        condition: service_healthy
    # Healthy = a backup succeeded in the last 25 hours ($$ stops Compose reading the $).
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backups/.last_success -mmin -1500 2>/dev/null)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

volumes:
  pgdata:
